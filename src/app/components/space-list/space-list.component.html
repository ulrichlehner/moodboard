<ng-container *ngIf="activeSpace$ | async as activeSpace; else blankTemplate">
  <ng-container *ngIf="spaces$ | async as spaces">
    <mat-nav-list>
      <header mat-subheader>Your Spaces ({{ spaces.length }})</header>
      <mat-list-item
        *ngFor="let space of spaces; trackBy: trackBySpace"
        [class.list-item-active]="space.id === activeSpace.id"
        (click)="onActivateSpaceClick(space)"
      >
        <span matLine>{{ space.name }}</span>
        <button
          mat-icon-button
          (click)="onOpenDialogClick(dialogTemplateEdit, space)"
          aria-label="Edit space"
        >
          <mat-icon>edit</mat-icon>
        </button>
        <button
          mat-icon-button
          (click)="onOpenDialogClick(dialogTemplateDelete, space)"
          [disabled]="spaces.length <= 1"
          aria-label="Delete space"
        >
          <mat-icon>delete_forever</mat-icon>
        </button></mat-list-item
      >
    </mat-nav-list>
  </ng-container>
</ng-container>

<ng-template #blankTemplate>
  <section fxLayout="column" [fxLayoutGap]="layout.spacing" spacing="p">
    <div>
      There are no spaces yet - start a new space and upload some media.
    </div>
    <button
      mat-raised-button
      color="primary"
      (click)="onCreateSpaceClick('My first Inspirespace')"
    >
      Start a Space
    </button>
  </section>
</ng-template>

<ng-template #dialogTemplateEdit>
  <header mat-dialog-title>Edit {{ currentSpace.name }}</header>
  <div mat-dialog-content matTypography>
    <app-space-detail #spaceDetail [space]="currentSpace"></app-space-detail>
  </div>
  <div mat-dialog-actions fxLayout="row" fxLayoutAlign="end">
    <button mat-flat-button mat-dialog-close>
      Cancel
    </button>
    <button
      mat-flat-button
      color="primary"
      mat-dialog-close
      (click)="spaceDetail.saveSpace()"
    >
      Save
    </button>
  </div>
</ng-template>

<ng-template #dialogTemplateDelete>
  <header mat-dialog-title>Delete {{ currentSpace.name }}</header>
  <div mat-dialog-content matTypography>
    <p>Do you really want to delete this space?</p>
    <p>This will permanently remove it including all containing artifacts.</p>
  </div>
  <div mat-dialog-actions fxLayout="row" fxLayoutAlign="end">
    <button mat-flat-button mat-dialog-close cdkFocusInitial>
      Cancel
    </button>
    <button
      mat-stroked-button
      color="warn"
      mat-dialog-close
      (click)="onDeleteSpaceClick(currentSpace)"
    >
      Delete
    </button>
  </div>
</ng-template>
