<mat-sidenav-container>
  <mat-sidenav #sidenav mode="over">
    <button mat-button (click)="sidenav.toggle()">
      Toggle
    </button>
    <div
      *ngIf="activeSpace"
      class="toolbar position-fixed d-flex"
      style="right: 10px; top: 10px; z-index: 10"
    >
      <button
        class="view-all btn btn-outline-light btn-sm"
        (click)="viewAllObjectsOnCanvas()"
      >
        <!-- TODO: compress icon -->
        <!-- <fa-icon [icon]="['fas', 'compress']" [fixedWidth]="true"></fa-icon> -->
        View All
      </button>
      <a
        class="download-space btn btn-outline-light btn-sm"
        href="#"
        role="button"
        download="{{ activeSpace.name }}.jpg"
        onclick="this.setAttribute('href', document.getElementById('canvas').toDataURL('image/jpeg'))"
      >
        <!-- TODO: camera icon -->
        <!-- <fa-icon [icon]="['fas', 'camera']" [fixedWidth]="true"></fa-icon> -->
        Download Screenshot
      </a>
      <label class="add-files btn btn-outline-light btn-sm">
        <!-- TODO: pluss / add icon -->
        <!-- <fa-icon [icon]="['fas', 'plus']" [fixedWidth]="true"></fa-icon> -->
        Upload
        <input
          type="file"
          multiple
          (change)="uploadFile($event)"
          aria-label="Upload images"
        />
      </label>
    </div>
    <!-- <progress max="100" [value]="saveProgress" *ngIf="saveProgress > 0"></progress> -->
    <app-space-list
      class="position-fixed"
      appearance="light"
      style="z-index: 10"
      [style.left]="activeSpace ? '10px' : '50vw'"
      [style.top]="activeSpace ? '10px' : '50vh'"
      [style.transform]="
        activeSpace ? 'translate(0, 0)' : 'translate(-50%, -50%)'
      "
    ></app-space-list>
    <app-tutorial
      *ngIf="activeSpace"
      class="position-fixed"
      style="left: 0; bottom: 0; z-index: 10"
    ></app-tutorial>
    <app-info
      class="position-fixed"
      style="right: 0; bottom: 0; z-index: 10"
    ></app-info>
  </mat-sidenav>

  <mat-sidenav-content>
    <button
      mat-button
      style="position: absolute; left: 20px; top: 20px; z-index: 2"
      (click)="sidenav.toggle()"
    >
      Toggle
    </button>
    <div
      id="canvas-wrapper"
      class="canvas-wrapper"
      (mousewheel)="mouseWheel($event)"
      (mousedown)="mouseDown($event)"
      (mousemove)="mouseMove($event)"
      (mouseup)="mouseUp($event)"
      (dragover)="dragOver()"
      (dragleave)="dragEnd()"
      (dragend)="dragEnd()"
      (drop)="drop($event)"
      [class.dragover]="isDragOver"
    >
      <canvas id="canvas" class="canvas"></canvas>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
