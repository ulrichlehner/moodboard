<mat-sidenav-container>
  <mat-sidenav #sidenav mode="over">
    <mat-toolbar role="header" color="primary">
      <button
        mat-icon-button
        aria-label="Close menu"
        (click)="sidenav.toggle()"
      >
        <mat-icon>menu</mat-icon>
      </button>
      <span fxFlex="1 1 auto">Inspireace</span
      ><button
        mat-icon-button
        aria-label="Start new Space"
        (click)="onCreateSpaceClick()"
      >
        <mat-icon>add</mat-icon>
      </button></mat-toolbar
    >

    <app-space-list></app-space-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <div
      id="canvas-wrapper"
      class="canvas-wrapper"
      (mousewheel)="mouseWheel($event)"
      (mousedown)="mouseDown($event)"
      (mousemove)="mouseMove($event)"
      (mouseup)="mouseUp($event)"
      (dragover)="dragOver()"
      (dragleave)="dragEnd()"
      (dragend)="dragEnd()"
      (drop)="drop($event)"
      [class.dragover]="isDragOver"
    >
      <canvas id="canvas" class="canvas"></canvas>
    </div>

    <mat-toolbar class="dummy-toolbar">
      <button
        mat-mini-fab
        color="primary"
        aria-label="Open menu"
        (click)="sidenav.toggle()"
      >
        <mat-icon>menu</mat-icon>
      </button>
    </mat-toolbar>

    <div *ngIf="activeSpace" style="right: 10px; top: 10px">
      <button (click)="viewAllObjectsOnCanvas()">
        <!-- TODO: compress icon -->
        <!-- <fa-icon [icon]="['fas', 'compress']" [fixedWidth]="true"></fa-icon> -->
        View All
      </button>
      <a
        href="#"
        role="button"
        download="{{ activeSpace.name }}.jpg"
        onclick="this.setAttribute('href', document.getElementById('canvas').toDataURL('image/jpeg'))"
      >
        <!-- TODO: camera icon -->
        <!-- <fa-icon [icon]="['fas', 'camera']" [fixedWidth]="true"></fa-icon> -->
        Download Screenshot
      </a>
      <label>
        <!-- TODO: pluss / add icon -->
        <!-- <fa-icon [icon]="['fas', 'plus']" [fixedWidth]="true"></fa-icon> -->
        Upload
        <input
          type="file"
          multiple
          (change)="uploadFile($event)"
          aria-label="Upload images"
        />
      </label>
    </div>

    <app-info style="right: 0; bottom: 0"></app-info>
    <app-tutorial *ngIf="activeSpace" style="left: 0; bottom: 0"></app-tutorial>
  </mat-sidenav-content>
</mat-sidenav-container>
