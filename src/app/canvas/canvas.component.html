<div class="toolbar position-fixed d-flex" style="right: 10px; top: 10px; z-index: 10">
  <label class="add-files btn btn-outline-light btn-sm">
    <fa-icon [icon]="['fas', 'plus']" [fixedWidth]="true"></fa-icon>
    <input type="file" multiple (change)="uploadFile($event)" aria-label="Upload images">
  </label>
  <button class="view-all btn btn-outline-light btn-sm" (click)="viewAllObjectsOnCanvas()">
    <fa-icon [icon]="['fas', 'compress']" [fixedWidth]="true"></fa-icon>
  </button>
</div>
<!-- <progress max="100" [value]="saveProgress" *ngIf="saveProgress > 0"></progress> -->
<app-space-list class="position-fixed" appearance="light" style="left: 10px; top: 10px; z-index: 10"></app-space-list>
<div id="canvas-wrapper" class="canvas-wrapper" (mousewheel)="mouseWheel($event)" (mousedown)="mouseDown($event)" (mousemove)="mouseMove($event)"
  (mouseup)="mouseUp($event)" (dragover)="dragOver()" (dragleave)="dragEnd()" (dragend)="dragEnd()" (drop)="drop($event)" [class.dragover]="isDragOver">
  <canvas id="canvas" class="canvas"></canvas>
</div>
