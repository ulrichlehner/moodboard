<div ngbDropdown *ngIf="activeSpace$ | async as activeSpace;else blank" autoClose="outside" #dropdownSpaces="ngbDropdown">
  <button ngbDropdownToggle class="btn btn-sm" [class.btn-outline-primary]="appearance === Appearance.Dark" [class.btn-outline-light]="appearance === Appearance.Light"
    type="button" id="dropdownSpaces" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
    {{ activeSpace.name }}
  </button>
  <ng-container *ngIf="spaces$ | async as spaces">
    <div ngbDropdownMenu aria-labelledby="dropdownSpaces">
      <header class="dropdown-header">Your Spaces ({{ spaces.length }})</header>
      <div *ngFor="let space of spaces" class="wrapper">
        <button class="dropdown-item" [class.active]="space.id === activeSpace.id" (click)="activateSpace(space)">
          {{ space.name }}</button>
        <div class="actions">
          <!-- <button class="btn btn-link" aria-label="Edit space">
            <fa-icon [icon]="['far', 'edit']" [fixedWidth]="true"></fa-icon>
          </button> -->
          <button class="btn btn-link" (click)="$event.stopPropagation(); openDeleteConfirmationDialog(modalDeleteConfirmation, space);"
            [disabled]="spaces.length <= 1" aria-label="Delete space">
            <fa-icon [icon]="['far', 'trash-alt']" [fixedWidth]="true"></fa-icon>
          </button>
        </div>
      </div>
      <div class="dropdown-divider"></div>
      <div class="px-4 py-0 mt-3">
        <button class="btn btn-link btn-sm pl-0 ml-0" (click)="addSpace()">Start new Space</button>
      </div>
    </div>
  </ng-container>
</div>

<ng-template #blank>
  <button class="btn btn-primary btn-sm" (click)="addSpace('My first Inspirespace')">Start new Space</button>
</ng-template>

<ng-template #modalDeleteConfirmation let-c="close" let-d="dismiss">
  <div class="modal-header">
    <header class="modal-title h5">Delete {{ spaceToBeDeleted.name }}</header>
    <button type="button" class="close" aria-label="Close" (click)="$event.stopPropagation(); d();">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="modal-body">
    Do you really want to delete this space? This will permanently remove it including all containing artifacts.
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="$event.stopPropagation(); c();">Cancel</button>
    <button type="button" class="btn btn-danger" (click)="$event.stopPropagation(); deleteSpace(spaceToBeDeleted); d();">Delete</button>
  </div>
</ng-template>
