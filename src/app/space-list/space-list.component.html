<div ngbDropdown *ngIf="activeSpace$ | async as activeSpace" autoClose="outside" #dropdownSpaces="ngbDropdown">
  <button ngbDropdownToggle class="btn btn-sm" [class.btn-outline-primary]="appearance === Appearance.Dark" [class.btn-outline-light]="appearance === Appearance.Light"
    type="button" id="dropdownSpaces" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
    {{ (activeSpace$ | async).name }}
  </button>
  <div ngbDropdownMenu aria-labelledby="dropdownSpaces">
    <header class="dropdown-header">Your Spaces ({{ (spaces$ | async).length }})</header>
    <button *ngFor="let space of spaces$ | async" class="dropdown-item" [class.active]="space.id === activeSpace.id" (click)="activateSpace(space)">{{ space.name }}
      <div class="dropdown-item__actions">
        <button class="btn btn-link" (click)="$event.stopPropagation();openDeleteConfirmationDialog(modalDeleteConfirmation, space);"
          [disabled]="(spaces$ | async).length <= 1">Delete</button>
      </div>
    </button>
    <div class="dropdown-divider"></div>
    <div class="px-4 py-0">
      <button class="btn btn-link btn-sm pl-0 ml-0" (click)="addSpace()">Start new Space</button>
    </div>
  </div>
</div>
<ng-template #modalDeleteConfirmation let-c="close" let-d="dismiss">
  <div class="modal-header">
    <header class="modal-title">Delete {{ spaceToBeDeleted.name }}</header>
    <button type="button" class="close" aria-label="Close" (click)="d()">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="modal-body">
    Do you really want to delete this space? This will permanently remove it including all containing artifacts.
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="c()">Cancel</button>
    <button type="button" class="btn btn-danger" (click)="deleteSpace(spaceToBeDeleted);d();">Delete</button>
  </div>
</ng-template>
