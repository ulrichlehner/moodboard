<h2>Artifacts</h2>
<ul>
  <li *ngFor="let artifact of artifacts$ | async" (click)="selectArtifact(artifact)" [class.selected]="artifact === activeArtifact">
    <h3>{{ artifact.name }}</h3>
  </li>
</ul>
<div *ngIf="activeArtifact">
  <strong>Selected: </strong>{{ activeArtifact.name }}
</div>
